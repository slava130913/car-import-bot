# Статический сайт калькулятора. Положить в /etc/nginx/sites-available/car-calc и включить:
#   ln -s /etc/nginx/sites-available/car-calc /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# HTTPS выдать через certbot: certbot --nginx -d calc.example.ru
server {
    listen 80;
    server_name calc.example.ru;   # замените на свой домен

    root /opt/car-import-bot/web;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    location ~* \.(js|json)$ {
        add_header Cache-Control "no-cache";
    }
}
