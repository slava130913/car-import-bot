# Бот и сайт. Локально: cp deploy/compose.local.yml compose.override.yml && docker compose up -d --build
# На сервере поверх этого файла кладётся deploy/compose.override.shared-network.yml (подключение к общему Caddy).
name: car-import-bot

services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - bot-data:/data
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    env_file: .env
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25

volumes:
  bot-data:
